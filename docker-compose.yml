# Production web image (nginx + SPA).
# On Debian, if the Spring API runs on the host (port 8080), host-gateway
# makes hostname "backend" resolve to the host so nginx can proxy /api.
services:
  web:
    build: .
    container_name: spanish-class-web
    restart: unless-stopped
    ports:
      - "80:80"
    extra_hosts:
      - "backend:host-gateway"
